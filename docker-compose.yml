# Nome FIXO de propósito. Sem ele o Compose usa o nome da PASTA como projeto, e
# cada worktree (scripts/worktree.sh) subiria um Postgres próprio e vazio na
# mesma porta 5432 — o banco de dev de verdade ficaria parado sem ninguém notar.
name: lifetrailer

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lifetrailer
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - /bin/bash
      - -c
      - |
        set -eu
        if [ ! -f /usr/share/postgresql/16/extension/pgtap.control ] \
        || [ ! -f /usr/share/postgresql/16/extension/pg_cron.control ]; then
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            postgresql-16-pgtap postgresql-16-cron
          rm -rf /var/lib/apt/lists/*
        fi
        printf 'CREATE EXTENSION IF NOT EXISTS pgtap;\n' > /docker-entrypoint-initdb.d/01-pgtap.sql
        # pg_cron NAO cabe num script de initdb: ele so pode ser criado depois
        # que o cluster subiu com a lib pre-carregada, e o initdb roda antes
        # disso. Entao espera o servidor e cria — uma vez, idempotente.
        (
          until pg_isready -h 127.0.0.1 -U postgres -d lifetrailer >/dev/null 2>&1; do sleep 1; done
          psql -h 127.0.0.1 -U postgres -d lifetrailer -qAtc \
            'create extension if not exists pg_cron' >/dev/null
        ) &
        # pg_cron so carrega via shared_preload_libraries, no START do cluster —
        # CREATE EXTENSION sozinho nao sobe o background worker. Mesmo motivo e
        # mesmos parametros do scripts/dev-db.sh, que e o caminho de nuvem.
        exec docker-entrypoint.sh postgres \
          -c shared_preload_libraries=pg_cron \
          -c cron.database_name=lifetrailer
    healthcheck:
      # Espera as DUAS extensoes: `docker compose up --wait` so devolve o
      # controle quando o pg_cron ja existe no banco.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lifetrailer && psql -h 127.0.0.1 -U postgres -d lifetrailer -Atc \"select count(*) from pg_extension where extname in ('pgtap','pg_cron')\" | grep -qx 2"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
